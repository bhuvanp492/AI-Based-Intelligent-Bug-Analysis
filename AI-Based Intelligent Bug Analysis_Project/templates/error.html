{% extends "base.html" %}

{% block title %}Error {{ code }} • AI Bug Analysis{% endblock %}
{% block page_heading %}System Notice{% endblock %}

{% block content %}
<div class="card empty-state" style="max-width: 600px; margin: 40px auto;">
  <div style="font-size: 48px; font-weight: 800; color: var(--status-danger); margin-bottom: 12px;">
    {{ code }}
  </div>
  <h2 class="empty-state-title" style="margin-bottom: 8px;">Notice</h2>
  <p style="font-size: 14px; color: var(--text-muted); margin-bottom: 24px; line-height: 1.5;">
    {{ message }}
  </p>
  <div>
    <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary">Return to Operations Overview</a>
  </div>
</div>
{% endblock %}
